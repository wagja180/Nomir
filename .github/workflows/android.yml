name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NomirForex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NomirForex-apk
          path: android-app/NomirForex.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: نومير فوركس — نسخة 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android-app/NomirForex.apk
          body: |
            تطبيق أندرويد لبوت الفوركس. نزّل ملف NomirForex.apk على هاتفك وثبّته.
            ⚠️ التطبيق يتداول بمال وهمي فقط — لا يوجد ربح مضمون.
